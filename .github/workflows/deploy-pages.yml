name: Deploy to GitHub Pages

# Official GitHub Pages deployment. Runs after the scheduled news
# workflow pushes new content, and on manual dispatch.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "articles/**"
      - "pages/**"
      - "data/articles.json"
      - "sitemap.xml"
      - "rss.xml"
      - "robots.txt"
      - "404.html"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
